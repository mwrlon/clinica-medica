services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: prosaude
    container_name: prosaude
    restart: unless-stopped
    working_dir: /var/www/prosaude
    volumes:
      - .:/var/www/prosaude
    depends_on:
      - db
    networks:
      - laravel-network

  webserver:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/prosaude
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

  db:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_medica
      MYSQL_ROOT_PASSWORD: 12341234
      MYSQL_USER: prosaude
      MYSQL_PASSWORD: prosaude123
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-network

volumes:
  dbdata:
    driver: local

networks:
  laravel-network:
    driver: bridge