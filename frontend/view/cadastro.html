<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSaúde - Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <header>
        <div>
            <a href="/">
                <img src="/icons/logo-prosaude.svg" alt="Ícone ProSaúde">
            </a>
        </div>
    </header>

    <main>
        <section id="cadastro">
            <div>
                <h1>Crie sua conta</h1>
                <p>Cadastre-se para agendar consultas e acompanhar seu histórico de saúde na ProSaúde.</p>
            </div>

            <form method="POST" action="/cadastro">
                <div>
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div>
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div>
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div>
                    <label for="nascimento">Data de nascimento</label>
                    <input type="date" id="nascimento" name="data_nascimento" required>
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" minlength="8" required>
                </div>

                <div>
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Repita a senha" minlength="8" required>
                </div>

                <div>
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Li e aceito os termos de uso e a política de privacidade</label>
                </div>

                <button type="submit">Criar conta</button>
            </form>

            <div>
                <p>Já tem uma conta? <a href="./login.html">Entrar</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 ProSaúde. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
